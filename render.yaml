services:
  # ── Backend API ────────────────────────────────────────────────────────
  - type: web
    name: buildmart-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: buildmart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value
    healthCheckPath: /health

  # ── Frontend static site ───────────────────────────────────────────────
  - type: static
    name: buildmart-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://buildmart-backend-9z4b.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: buildmart-db
    databaseName: buildmart
    plan: free
